services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: milk
      POSTGRES_PASSWORD: milk
      POSTGRES_DB: milk_receipt
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milk -d milk_receipt"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
